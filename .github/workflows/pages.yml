name: Build and deploy Quran Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint && npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_STATIC: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Select the built site as the Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_pages_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          if [ "$task_pages_type" != "workflow" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow --silent || {
              echo 'Select GitHub Actions in Settings > Pages, then rerun this workflow.'
              exit 1
            }
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
