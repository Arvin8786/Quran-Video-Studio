    // Helper for Canvas Text Wrapping
    function getWrappedLines(ctx, text, maxWidth) {
      if (!text) return [];
      const words = text.split(' ');
      let lines = [];
      let currentLine = words[0] || '';

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + ' ' + word).width;
        if (width < maxWidth) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

              ctx.globalAlpha = textAlpha;

              const maxContentW = width * (aspectRatio === '9:16' ? 0.86 : 0.82);
              const centerX = width / 2;

              const topMinY = aspectRatio === '9:16' ? 180 : 110;
              const bottomMaxY = aspectRatio === '9:16' ? (height - 230) : (height - 120);
              const availableHeight = bottomMaxY - topMinY;

              const aScale = arabicFontScaleRef.current || 1.0;
              const tScale = translationFontScaleRef.current || 1.0;

              // Base target font sizes scaled by user sliders
              const baseArabicPx = aspectRatio === '9:16' ? Math.round(44 * aScale) : Math.round(42 * aScale);
              const baseLitPx = aspectRatio === '9:16' ? Math.round(20 * tScale) : Math.round(18 * tScale);
              const baseTransPx = aspectRatio === '9:16' ? Math.round(22 * tScale) : Math.round(20 * tScale);

              const arabicFull = curVerse.arabic + ` ۝${curVerse.numberInSurah}`;
              const transLitText = `"${curVerse.transliteration}"`;
              const transText = curVerse.translation;

              // Dynamic measurement helper
              const measureVerseBlock = (aPx, lPx, tPx) => {
                ctx.font = `bold ${aPx}px 'Amiri', serif`;
                const aLines = getWrappedLines(ctx, arabicFull, maxContentW);
                const aLineH = Math.round(aPx * 1.48);
                const aH = aLines.length * aLineH;

                ctx.font = `italic 600 ${lPx}px 'Inter', sans-serif`;
                const lLines = getWrappedLines(ctx, transLitText, maxContentW);
                const lLineH = Math.round(lPx * 1.42);
                const lH = lLines.length * lLineH;

                ctx.font = `500 ${tPx}px 'Inter', sans-serif`;
                const tLines = getWrappedLines(ctx, transText, maxContentW);
                const tLineH = Math.round(tPx * 1.42);
                const tH = tLines.length * tLineH;

                const gap1 = Math.round(22 * Math.min(1.2, tScale));
                const gap2 = Math.round(18 * Math.min(1.2, tScale));
                const totalH = aH + gap1 + lH + gap2 + tH;

                return { aLines, aLineH, aH, lLines, lLineH, lH, tLines, tLineH, tH, gap1, gap2, totalH };
              };

              let meas = measureVerseBlock(baseArabicPx, baseLitPx, baseTransPx);

              // If block height exceeds available safe vertical area -> proportionally auto-clamp
              if (meas.totalH > availableHeight) {
                const clampRatio = Math.max(0.48, (availableHeight - 20) / meas.totalH);
                const clampedArabic = Math.max(20, Math.floor(baseArabicPx * clampRatio));
                const clampedLit = Math.max(12, Math.floor(baseLitPx * clampRatio));
                const clampedTrans = Math.max(13, Math.floor(baseTransPx * clampRatio));
                meas = measureVerseBlock(clampedArabic, clampedLit, clampedTrans);
              }

              // Perfectly center the text block inside the safe viewport
              const startY = topMinY + Math.max(0, (availableHeight - meas.totalH) / 2);
              let currentY = startY;

              // 1. Draw Arabic
              ctx.font = `bold ${meas.aLineH / 1.48}px 'Amiri', serif`;
              ctx.fillStyle = '#fde047';

              ctx.shadowColor = 'rgba(0,0,0,0.9)';

              meas.tLines.forEach((line) => {

      // 6. Sequential Audio Playback & Synchronized Recording Pipeline

        platform: captionsPlatform,

        selectedSurah,
        selectedLesson,
        selectedReciter
      });

      const copyToClipboard = (text, fieldName) => {
        if (!text) return;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text);
          } else {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
          }
        } catch (e) {
          console.warn('Clipboard write error:', e);
        }
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(null), 2000);
      };

      // Automated Multi-Channel Publishing Engine with Real Backend API Integration
      const publishToConnectedAccounts = async (specificChannels = null) => {
        const activeList = (specificChannels || socialChannels).filter(c => c.connected && c.autoPost);
        if (activeList.length === 0) {
          setShareStatus('⚠️ No social accounts are currently connected with Auto-Post enabled.');
          setTimeout(() => setShareStatus(''), 4500);
          return;
        }

        // Initialize Live Publishing Modal State
        setPublishModalData({
          active: true,
          videoTitle: captionsKit.title,
          videoDescription: captionsKit.description,
          tags: captionsKit.hashtags,
          isPublishing: true,
          channels: activeList.map(c => ({
            id: c.id,
            name: c.name,
            badge: c.badge,
            color: c.color,
            handle: c.handle,
            avatar: c.avatar,
            privacy: c.privacy || 'public',
            status: 'uploading',
            stepMsg: 'Dispatching to ' + c.name + '...',
            progress: 25,
            postUrl: '',
            postId: ''
          }))
        });

        for (let ch of activeList) {
          // Progress Phase 1: Uploading video stream & metadata
          setPublishModalData(prev => ({
            ...prev,
            channels: prev.channels.map(c => c.id === ch.id ? {
              ...c,
              stepMsg: 'Uploading 1080p MP4 master stream & applying SEO metadata...',
              progress: 60
            } : c)
          }));

          try {
            // Real Server API Call to publish
            const pubRes = await fetch(`/api/publish/${ch.id}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: captionsKit.title,
                description: captionsKit.description,
                hashtags: captionsKit.hashtags,
                privacy: ch.privacy || 'public',
                videoFileName: downloadFilename || 'ProEase_Studio_1080p.mp4'
              })
            });

            const pubData = await pubRes.json();

            if (pubRes.ok && pubData.success) {
              setPublishModalData(prev => ({
                ...prev,
                channels: prev.channels.map(c => c.id === ch.id ? {
                  ...c,
                  status: 'published',
                  stepMsg: '✓ ' + (pubData.message || 'Published live!'),
                  progress: 100,
                  postUrl: pubData.postUrl || '',
                  postId: pubData.postId || ''
                } : c)
              }));

              // Update session stats in persistent state
              setSocialChannels(prev => prev.map(c => c.id === ch.id ? {
                ...c,
                totalPosts: (c.totalPosts || 0) + 1,
                lastPostDate: 'Just now'
              } : c));
            } else {
              setPublishModalData(prev => ({
                ...prev,
                channels: prev.channels.map(c => c.id === ch.id ? {
                  ...c,
                  status: pubData.authError ? 'auth_required' : 'failed',
                  stepMsg: (pubData.authError ? '⚠️ ' : '⚠️ ') + (pubData.message || pubData.error || 'Publishing error'),
                  progress: 100,
                  postUrl: pubData.postUrl || (ch.id === 'youtube' ? 'https://studio.youtube.com/channel/upload' : '')
                } : c)
              }));

              if (pubData.authError) {
                setSocialChannels(prev => prev.map(c => c.id === ch.id ? { ...c, verified: false } : c));
                setShareStatus(`⚠️ ${ch.name} session expired. Reconnect in Social Accounts.`);
              }
            }
          } catch (netErr) {
            setPublishModalData(prev => ({
              ...prev,
              channels: prev.channels.map(c => c.id === ch.id ? {
                ...c,
                status: 'failed',
                stepMsg: '⚠️ Network connection issue',
                progress: 100
              } : c)
            }));
          }

          await new Promise(r => setTimeout(r, 400));
        }

        // Finalize modal
        setPublishModalData(prev => ({ ...prev, isPublishing: false }));

        // Append to saved publication history in localStorage & fetch updated server history
        try {
          const entry = {
            id: 'pub_' + Date.now(),
            title: captionsKit.title,
            mode: activeMode,
            aspectRatio,
            date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' • ' + new Date().toLocaleDateString(),
            channelNames: activeList.map(c => c.name).join(', ')
          };
          const curHistory = JSON.parse(localStorage.getItem('proease_published_history_v1') || '[]');
          curHistory.unshift(entry);
          localStorage.setItem('proease_published_history_v1', JSON.stringify(curHistory.slice(0, 30)));
          setPublishedHistory(curHistory.slice(0, 30));
        } catch (e) {}
      };

      const handleToggleAutoPost = (channelId) => {
        setSocialChannels(prev => prev.map(c => c.id === channelId ? { ...c, autoPost: !c.autoPost } : c));
      };

      const handleDisconnectSocial = async (channelId) => {
        try {
          await fetch('/api/auth/disconnect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ provider: channelId })
          });
        } catch (e) {}

        setSocialChannels(prev => prev.map(c => c.id === channelId ? {
          ...c,
          connected: false,
          sessionToken: '',
          connectedAt: null,
          autoPost: false,
          verified: false
        } : c));
      };

      // Real Token Verification & Persistent Session Saving with Provider API
      const handleVerifyAndSaveToken = async (channelId, token, handle, name, privacy, channelRefId) => {
        setVerifyingToken(true);
        setAuthError('');
        try {
          const resp = await fetch('/api/auth/save-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: channelId,
              accessToken: token,
              accountName: name,
              handle: handle,
              privacy: privacy || 'public',
              channelId: channelRefId
            })
          });
          const data = await resp.json();
          if (!resp.ok || data.error) {
            setAuthError(data.error || 'Failed to verify token with provider');
            setVerifyingToken(false);
            return;
          }
          const s = data.session;
          setSocialChannels(prev => prev.map(c => c.id === channelId ? {
            ...c,
            connected: true,
            handle: s.handle || handle || c.handle,
            accountName: s.accountName || name || c.accountName,
            avatar: s.avatar || c.avatar,
            privacy: s.privacy || privacy || 'public',
            channelId: s.channelId || channelRefId || c.channelId,
            verified: s.verified || false,
            connectedAt: 'Persistent Session Saved',
            autoPost: true
          } : c));
          setConnectingChannel(null);
          setShareStatus(data.message || `✓ ${channelId.toUpperCase()} session authorized and saved permanently!`);
          setTimeout(() => setShareStatus(''), 4500);
        } catch (err) {
          setAuthError(err.message || 'Verification request failed');
        } finally {
          setVerifyingToken(false);
        }
      };

      // Real 1-Click OAuth Popup Launcher
      const handleLaunchOAuthPopup = async (channelId) => {
        setAuthError('');
        try {
          const res = await fetch(`/api/auth/${channelId}/url`);
          const data = await res.json();
          if (data.url) {
            const width = 600;
            const height = 720;
            const left = window.screen.width / 2 - width / 2;
            const top = window.screen.height / 2 - height / 2;
            window.open(data.url, 'oauth_popup', `width=${width},height=${height},top=${top},left=${left},status=no,resizable=yes`);
          } else {
            setAuthError(`No OAuth App credentials configured on server for ${channelId.toUpperCase()}. Add CLIENT_ID to .env or connect using Direct Token in Tab 1.`);
          }
        } catch (err) {
          setAuthError('Failed to generate OAuth URL: ' + err.message);
        }
      };

      const handleNativeShare = async () => {
        const shareTitle = captionsKit.title;

        let sharePayload = {
          title: shareTitle,
          text: shareText

          sharePayload.files = [recordedFile];
        } else {
          sharePayload.url = window.location.href;
        }

        if (navigator.share) {
          try {
            await navigator.share(sharePayload);
            setShareStatus('✓ Shared successfully!');
            setTimeout(() => setShareStatus(''), 4000);
          } catch (err) {
            if (err.name !== 'AbortError') {
              copyToClipboard(`${shareTitle}\n\n${shareText}\n${window.location.href}`, 'shareAll');
              setShareStatus('✓ Captions & link copied to clipboard!');
              setTimeout(() => setShareStatus(''), 4000);
            }
          }
        } else {
          copyToClipboard(`${shareTitle}\n\n${shareText}\n${window.location.href}`, 'shareAll');
          setShareStatus('✓ Captions & link copied to clipboard! Paste into TikTok, YouTube or Facebook.');
          setTimeout(() => setShareStatus(''), 4500);
        }

      const handleDirectShare = (platform) => {

          setShareStatus('✓ Captions copied! Opening Facebook Share...');

        setTimeout(() => setShareStatus(''), 4500);
      };

      return (

              <span className="text-sm text-emerald-400 font-medium flex items-center gap-2 hidden lg:flex">

                {statusText}

          {/* Main Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-[480px_1fr] gap-6 p-6 max-w-[1700px] mx-auto w-full">

                    onClick={() => {

                    className={`p-2.5 rounded-xl border text-xs font-semibold flex flex-col items-center gap-1 transition ${activeMode === 'lessons' ? 'bg-amber-500/20 border-amber-500 text-amber-200 shadow-lg shadow-amber-500/10' : 'bg-slate-800/50 border-slate-700/60 text-slate-400 hover:bg-slate-800'}`}
                  >

              {/* Typography, Font Resizing & Frame Safe-Zone Control Card */}

          {showAiModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto custom-scrollbar">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-lg">
                      ✨
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">AI Shorts Script & Prompt Studio</h3>
                      <p className="text-xs text-slate-400">Contextual AI-crafted prompts, hook scripts & video production briefs</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => setShowAiModal(false)}
                    className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Brief Content */}
                {(() => {
                  const brief = typeof generateAIShortsScript === 'function' ? generateAIShortsScript(selectedLesson) : null;
                  if (!brief) return null;
                  return (
                    <div className="space-y-4 text-xs">
                      <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                        <span className="text-[10px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded font-bold">TARGET REFERENCE</span>
                        <div className="text-sm font-bold text-amber-300">{brief.targetRef} — {brief.title}</div>
                        <p className="text-slate-300 italic">"{brief.coreMessage}"</p>
                      </div>

                      <div className="space-y-1.5">
                        <label className="font-semibold text-slate-300 flex items-center gap-1">
                          <span>🎬</span> AI Video Generation Prompt (Veo / Sora / Runway)
                        </label>
                        <textarea 
                          readOnly 
                          rows="3" 
                          value={brief.videoPrompt} 
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 font-mono text-[11px] select-all"
                        />
                      </div>

                      <div className="space-y-1.5">
                        <label className="font-semibold text-slate-300 flex items-center gap-1">
                          <span>🎙️</span> Voiceover & Hook Script (0-15s)
                        </label>
                        <textarea 
                          readOnly 
                          rows="3" 
                          value={`${brief.hookScript}\n\n${brief.reflectionNotes}`} 
                          className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 font-mono text-[11px] select-all"
                        />
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                          <span className="font-semibold text-slate-300 block">🎨 Typography & Layout</span>
                          <p className="text-slate-400 text-[11px]">{brief.typography}</p>
                        </div>
                        <div className="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                          <span className="font-semibold text-slate-300 block">#️⃣ Recommended Tags</span>
                          <p className="text-emerald-300 text-[11px] font-mono">{brief.hashtags.join(' ')}</p>
                        </div>
                      </div>

                      <div className="pt-2 flex justify-end gap-3">
                        <button
                          onClick={() => {
                            const fullText = `${brief.title}\n\nVideo Prompt:\n${brief.videoPrompt}\n\nScript:\n${brief.hookScript}\n\n${brief.reflectionNotes}\n\nHashtags:\n${brief.hashtags.join(' ')}`;
                            copyToClipboard(fullText, 'aiBrief');
                          }}
                          className={`px-5 py-2.5 rounded-xl font-bold text-xs transition ${copiedField === 'aiBrief' ? 'bg-emerald-500 text-slate-950' : 'bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950'}`}
                        >
                          {copiedField === 'aiBrief' ? '✓ Production Brief Copied!' : '📋 Copy Full AI Production Brief'}
                        </button>
                      </div>
                    </div>
                  );
                })()}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
